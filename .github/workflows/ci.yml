name: CI 质量门禁
# YYC³ Monorepo Phase 6 门禁（P3 九阶段简化本地态；触发：push/PR → main）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新推送自动取消旧跑批，节约 CI 时长
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本读取根 package.json 的 packageManager（pnpm@12），与 lockfile 生成环境严格一致
      # （v9 会忽略 pnpm-workspace.yaml 的 overrides/packageExtensions → frozen-lockfile 必败）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖（含安全审查）
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high || true
      - name: 质量门禁（tsc × 十二包/四端 + build + vi.mock + i18n + 复用率）
        run: bash scripts/verify-gates.sh
      - name: 测试（vitest 分片）
        run: pnpm --filter @yyc3/app-web-full test -- --run && pnpm --filter @yyc3/app-sandbox-lite test -- --run
        env:
          # web-full 套件体量大（289 文件），防 vitest worker fork 触发 V8 默认堆上限 OOM
          NODE_OPTIONS: --max-old-space-size=4096

  # ── SAST（静态应用安全测试）────────────────────────────
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: apps/app-desktop/.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ── Lighthouse（performance ≥0.9 断言，lighthouserc.js）──
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建（app-desktop @ 3032）
        run: pnpm --filter @yyc3/app-desktop build
      - name: 起服 + Lighthouse CI 断言
        working-directory: apps/app-desktop
        run: |
          npx vite preview --port 3032 --strictPort &
          npx wait-on http://localhost:3032 --timeout 60000
          npx lhci autorun
      - name: 归档 Lighthouse 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/app-desktop/.lighthouseci
          if-no-files-found: ignore

  # 发布产物管线（Electron 三平台 / Docker GHCR）→ .github/workflows/release.yml（tag v* 触发）
