# YYC³ CloudPivot Matrix · pnpm 工作区（M1 Monorepo 底座）
# 四端应用 + 共享包 + 工具配置
packages:
  - apps/*
  - packages/*
  - tools/*
  - services/*

# pnpm v12 设置新家：构建脚本批准表（v11 的 onlyBuiltDependencies 继任键，
# 键名变更曾致 electron/esbuild postinstall 被静默跳过）
allowBuilds:
  # @nestjs/core postinstall = 装包版本一致性检查（混版预警），放行有益无害
  '@nestjs/core': true
  # Prisma 三件套 postinstall = 引擎下载 + client 生成，必须放行否则 generate/migrate 全挂
  '@prisma/client': true
  '@prisma/engines': true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true

# pnpm 12 默认拦截 git 直连的子依赖（exotic subdeps）；@electron/rebuild 官方
# 声明 @electron/node-gyp 为 github: 直连（electron 工具链 fork），属可信上游，
# 显式放行
blockExoticSubdeps: false

overrides:
  lodash: ^4.18.0
  lodash-es: ^4.18.0
  tmp: ^0.2.4
  "@tootallnate/once": ^3.0.1
  tar: ^7.5.11
  # 1.x 分线安全修法：1.1.12（旧 CVE-2025-5889）→ ^1.1.21（覆盖 6 条 DoS 公告，
  # 最新 GHSA-q2hr-2g5m-vwhr 要求 >=1.1.21，均为 1.x 线内补丁零兼容风险）
  brace-expansion@1: ^1.1.21
  # 2.x 分线同步加固（原三端 package.json 旧式 overrides 迁入；pnpm 12 不再读
  # package.json 的 pnpm 字段，统一收编至根 workspace）
  brace-expansion@2: ^2.0.2
  # GHSA-c475-qrg2-pj4r：Client.list() RE_LINE 回溯 DoS，6.x 线内补丁
  basic-ftp: ^6.2.1
  # GHSA-w5hq-g745-h8pq（uuid v3/v5/v6 buf 越界，CVE-2026-41907）：补丁线 11.1.1+。
  # 消费方仅 @lhci/cli（dev-only，runtime 用 v4 随机 UUID），选 legacy-11 线：
  # 8→11 为最小 API 距离补丁线（CJS require + v4 命名导出兼容），13/14 线 ESM 化风险高
  "uuid@^8.3.1": ^11.1.1
  # ── 以下安全 range 修复自三端嵌套 pnpm-workspace.yaml 迁入（pnpm 12 只读根
  #    workspace 配置；嵌套文件已删除。tar/tmp/@tootallnate/once/lodash 与根
  #    全量固定 override 重叠，以根为准不重复迁入）──
  # brace-expansion 4.x 线 DoS 补丁线内修复
  "brace-expansion@>=4.0.0 <5.0.5": ">=5.0.5"
  # flatted 序列化原型污染修复
  "flatted@<3.4.0": ">=3.4.0"
  "flatted@<=3.4.1": ">=3.4.2"
  # picomatch ReDoS 修复
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4"
  # undici 7.x 线内补丁（两条 range 修复重叠，合并为一条）
  "undici@>=7.0.0 <7.24.0": ">=7.24.0"
  # yaml 1.x 线内补丁
  "yaml@>=1.0.0 <1.10.3": ">=1.10.3"

# pnpm audit 豁免登记（2026-10-15 远程复核：OSV 公告库 + npm registry 实况；
# 均为 dev-only 工具链传递依赖，运行时不触达；上游发布补丁后应移除豁免并复扫）
auditConfig:
  ignoreGhsas:
    # extract-zip <=2.0.1 symlink 路径穿越（GHSA-jmr9-qjv8-65gv HIGH + GHSA-7pqw-9j4j-h8q3
    # HIGH，CVE-2026-56876 / CVE-2026-19693）。2026-10-15 复核：registry latest 仍 2.0.1
    # 无补丁版本；3.x ESM-only 无法被 CJS 的 @puppeteer/browsers require；puppeteer-core
    # 24 线全程捆绑 browsers 2.x（线内摘除不可行），browsers 3.x 已移除 extract-zip 但属
    # puppeteer-core 25 大版本线，跨线升级将波及 lighthouse 12.6.1 CI 门禁。zip 源为官方
    # Chromium CDN，且本仓 CI/本地均使用系统 Chrome（下载路径不触达），链路双重不触达
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # sprintf-js <=1.1.3 无界精度符 DoS（GHSA-hp3w-g68c-fv3c MODERATE，CVE-2026-97058）。
    # 2026-10-15 复核：registry latest 仍 1.1.3（1.0.3 同受影响）无补丁版本；
    # @lhci/utils>js-yaml@3>argparse 与 electron-builder>@electron/get>global-agent>roarr
    # 双链传递，格式串均为工具内部常量（无攻击者可控入口），运行时不触达
    - GHSA-hp3w-g68c-fv3c

