# YYC³ CloudPivot Matrix · pnpm 工作区（M1 Monorepo 底座）
# 四端应用 + 共享包 + 工具配置
packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  electron: set this to true or false
  electron-winstaller: set this to true or false
  esbuild: set this to true or false

# pnpm v10+ 设置新家（package.json 的 pnpm 字段自 pnpm v10 起不再读取）
# 构建脚本白名单（pnpm v10+ 默认忽略依赖构建脚本，需显式批准）
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild

overrides:
  lodash: ^4.18.0
  lodash-es: ^4.18.0
  tmp: ^0.2.4
  "@tootallnate/once": ^3.0.1
  tar: ^7.5.11
  brace-expansion@1: 1.1.12

