# YYC³ LeisureManage · 边缘分流(见 compose 头注);健康检查端点 /healthz
server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options nosniff always;

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # API → frp 隧道(NAS yyc3-leisure-api);经 Traefik 已有 rate-limit/security-headers
  location /api/v1/ {
    proxy_pass http://host.docker.internal:8801;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    client_max_body_size 20m;
  }

  # 艺人端 H5(Taro hash router;API_BASE 编译期内联 https://lm.0379.pro/api/v1,跨域已被 API 白名单放行)
  location /m/ {
    alias /usr/share/nginx/html/h5/;
    try_files $uri $uri/ /m/index.html;
  }
  location = /m { return 301 /m/; }

  # Web 管理端(hash router;相对路径 /api/v1 同源)
  location / {
    root /usr/share/nginx/html/web;
    try_files $uri $uri/ /index.html;
  }
}
