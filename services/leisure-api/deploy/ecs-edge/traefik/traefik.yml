# @tags traefik,configuration,ssl,certificates

log:
  level: INFO
  format: json

accessLog:
  format: json
  filePath: /var/log/traefik/access.log

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
          
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@0379.email
      storage: /acme.json
      httpChallenge:
        entryPoint: web
      tlsChallenge: {}
