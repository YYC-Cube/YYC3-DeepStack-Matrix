# YYC³ LeisureAPI · NAS 生产编排(yyc3-45 · F4-423,Docker 应用层 V3 NVMe)
# 数据库不在本编排内:PG15 主库在宿主主机 5433(NAS 192.168.3.45 为流复制备库,只读);
# API 通过 env 中 DATABASE_URL 连主库;Redis 随编排起(仅 API 内部使用,不对外发布)
#
# 启动:docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# 构建上下文为 monorepo 根(见 Dockerfile.prod 头注)

services:
  api:
    build:
      context: ../../../../
      dockerfile: services/leisure-api/deploy/nas/Dockerfile.prod
    image: leisure-api:prod
    container_name: leisure-api-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: prod
      REDIS_URL: redis://redis:6379
    ports:
      # 仅绑定本机回环/Tailscale 网段由网关反代;不要 0.0.0.0 直出公网
      - "127.0.0.1:3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 未带 token 的 /auth/me 返回 401 即为服务已起(非 5xx/连接拒绝)
      test: ["CMD-SHELL", "wget -qO- --server-response http://127.0.0.1:3001/api/v1/auth/me 2>&1 | grep -q ' 401 '"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: leisure-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - leisure-redis-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  leisure-redis-prod:
