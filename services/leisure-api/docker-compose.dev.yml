# YYC³ LeisureAPI · 本地开发环境(PostgreSQL 15 + Redis + API)
# 只起数据层:docker compose -f docker-compose.dev.yml up -d
# 一键全栈(development profile,含 API):docker compose -f docker-compose.dev.yml --profile full up -d
# 或:bash scripts/dev-up.sh(含编译)
# 说明:密码仅为本地开发;生产凭据走密钥管理(~/.yyc3-keybackup)
# 2026-11-02 切 PostgreSQL:与部署目标(NAS yyc3-45 PG15,端口 5433)引擎/端口对齐;MySQL 迁移归档于 prisma/migrations-mysql-archive

services:
  api:
    build: .
    image: leisure-api:dev
    container_name: leisure-api
    profiles: ["full"]
    working_dir: /workspace/services/leisure-api
    # bind-mount 仓库根:复用宿主 node_modules 与已编译 dist(铁律:领域逻辑 import leisure-core 的 dist)
    volumes:
      - ../../:/workspace:rw
    environment:
      # 容器内直连 compose 网络(覆盖 .env 中的 127.0.0.1 宿主映射)
      DATABASE_URL: postgresql://leisure_app:leisure-app-dev-only@postgres:5432/leisure?schema=public
      REDIS_URL: redis://redis:6379
    command: sh -c "node --env-file=.env --watch dist/main.js"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: leisure-postgres
    environment:
      POSTGRES_DB: leisure
      POSTGRES_USER: leisure
      POSTGRES_PASSWORD: leisure-dev-only
      # 应用运行账号口令(由 docker/pg-init/01-accounts.sh 读取创建 leisure_app)
      LEISURE_APP_PASSWORD: leisure-app-dev-only
    ports:
      # 5434:本机 5433 是生产 PG15 主库(Homebrew,NAS 为流复制备库),开发容器必须避开
      - "5434:5432"
    volumes:
      - leisure-pg-data:/var/lib/postgresql/data
      # 仅数据卷首次初始化时执行:创建 leisure_app 运行角色 + 默认权限
      - ./docker/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leisure -d leisure"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: leisure-redis
    ports:
      # 6380 而非 6379:本机常有 redis-server 占用 IPv4 6379
      - "6380:6379"
    volumes:
      - leisure-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  leisure-pg-data:
  leisure-redis-data:
